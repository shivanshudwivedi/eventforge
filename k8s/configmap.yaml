apiVersion: v1
kind: ConfigMap
metadata:
  name: eventforge
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DATABASE_URL: jdbc:postgresql://postgres:5432/eventforge
  DATABASE_USER: eventforge
  REDIS_HOST: redis
  EVENTFORGE_EVENTS_TOPIC: eventforge.events
  EVENTFORGE_PARTITIONS: "24"
  EVENTFORGE_REPLICATION_FACTOR: "3"
  TRACING_SAMPLE_RATE: "0.1"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
